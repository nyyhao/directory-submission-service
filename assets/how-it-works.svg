<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="How SubmitStorm works: 1 pick a package, 2 fill in one brief, 3 add the badge component or skip it, 4 get the report with proof of every listing">
  <rect width="1280" height="300" rx="24" fill="#0E0E11"/>
  <rect x="0.5" y="0.5" width="1279" height="299" rx="23.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <g stroke="#FFD12E" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="6 8">
      <line x1="290" y1="150" x2="330" y2="150"/><line x1="600" y1="150" x2="640" y2="150"/><line x1="910" y1="150" x2="950" y2="150"/>
    </g>
    <!-- step cards -->
    <g transform="translate(40 40)">
      <rect width="250" height="220" rx="18" fill="#17171C" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <circle cx="40" cy="44" r="20" fill="#FFD12E"/><text x="40" y="51" text-anchor="middle" font-size="19" font-weight="800" fill="#0E0E11">1</text>
      <text x="24" y="104" font-size="22" font-weight="700" fill="#F2F0EA">Pick a package</text>
      <text x="24" y="136" font-size="16" fill="#C4C1B9">50, 100, 150 or 200</text>
      <text x="24" y="160" font-size="16" fill="#C4C1B9">directories, paid once.</text>
      <text x="24" y="196" font-size="15" font-weight="600" fill="#FFD12E">$49 to $299</text>
    </g>
    <g transform="translate(350 40)">
      <rect width="250" height="220" rx="18" fill="#17171C" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <circle cx="40" cy="44" r="20" fill="#FFD12E"/><text x="40" y="51" text-anchor="middle" font-size="19" font-weight="800" fill="#0E0E11">2</text>
      <text x="24" y="104" font-size="22" font-weight="700" fill="#F2F0EA">Fill in one brief</text>
      <text x="24" y="136" font-size="16" fill="#C4C1B9">Name, URL, descriptions,</text>
      <text x="24" y="160" font-size="16" fill="#C4C1B9">logo, screenshot.</text>
      <text x="24" y="196" font-size="15" font-weight="600" fill="#FFD12E">about 5 minutes</text>
    </g>
    <g transform="translate(660 40)">
      <rect width="250" height="220" rx="18" fill="#17171C" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <circle cx="40" cy="44" r="20" fill="#A394FF"/><text x="40" y="51" text-anchor="middle" font-size="19" font-weight="800" fill="#0E0E11">3</text>
      <text x="24" y="104" font-size="22" font-weight="700" fill="#F2F0EA">Badge or skip</text>
      <text x="24" y="136" font-size="16" fill="#C4C1B9">One footer snippet adds</text>
      <text x="24" y="160" font-size="16" fill="#C4C1B9">badge-only directories.</text>
      <text x="24" y="196" font-size="15" font-weight="600" fill="#A394FF">up to 50 more</text>
    </g>
    <g transform="translate(970 40)">
      <rect width="270" height="220" rx="18" fill="#17171C" stroke="#4ADE80" stroke-opacity="0.45"/>
      <circle cx="40" cy="44" r="20" fill="#4ADE80"/><text x="40" y="51" text-anchor="middle" font-size="19" font-weight="800" fill="#0E0E11">4</text>
      <text x="24" y="104" font-size="22" font-weight="700" fill="#F2F0EA">Get the report</text>
      <text x="24" y="136" font-size="16" fill="#C4C1B9">Every listing with link and</text>
      <text x="24" y="160" font-size="16" fill="#C4C1B9">screenshot, Excel and CSV.</text>
      <text x="24" y="196" font-size="15" font-weight="600" fill="#4ADE80">within 7 to 14 days</text>
    </g>
  </g>
</svg>
