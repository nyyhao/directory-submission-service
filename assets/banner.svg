<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="SubmitStorm: directory submission service for startups, SaaS and AI tools">
  <defs>
    <radialGradient id="glow" cx="78%" cy="30%" r="60%">
      <stop offset="0" stop-color="#FFD12E" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFD12E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="10%" cy="100%" r="55%">
      <stop offset="0" stop-color="#A394FF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#A394FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
    <linearGradient id="rain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD12E" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFD12E" stop-opacity="0.75"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="420" rx="28" fill="#0E0E11"/>
  <rect width="1280" height="420" rx="28" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="28" fill="url(#glow)"/>
  <rect width="1280" height="420" rx="28" fill="url(#glow2)"/>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="27.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.1"/>

  <!-- rain of links -->
  <g stroke="url(#rain)" stroke-width="3" stroke-linecap="round">
    <line x1="900" y1="40" x2="890" y2="110"/><line x1="960" y1="70" x2="950" y2="150"/>
    <line x1="1020" y1="30" x2="1010" y2="100"/><line x1="1080" y1="90" x2="1070" y2="170"/>
    <line x1="1140" y1="50" x2="1130" y2="120"/><line x1="1200" y1="110" x2="1190" y2="180"/>
    <line x1="930" y1="200" x2="920" y2="260"/><line x1="1050" y1="210" x2="1040" y2="280"/>
    <line x1="1170" y1="230" x2="1160" y2="300"/>
  </g>
  <!-- bolt -->
  <g transform="translate(1000 170) scale(4.2)">
    <path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z" fill="#FFD12E" stroke="#0E0E11" stroke-width="0.8" stroke-linejoin="round"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <g transform="translate(64 72)">
      <rect width="250" height="34" rx="17" fill="#FFD12E" fill-opacity="0.13" stroke="#FFD12E" stroke-opacity="0.4"/>
      <circle cx="20" cy="17" r="5" fill="#4ADE80"/>
      <text x="34" y="23" font-size="15" font-weight="600" fill="#FFD12E">Directory submission service</text>
    </g>
    <text x="64" y="176" font-size="68" font-weight="800" fill="#F2F0EA" letter-spacing="-2">Submit<tspan fill="#FFD12E">Storm</tspan></text>
    <text x="64" y="226" font-size="27" font-weight="500" fill="#C4C1B9">Your product on 50 to 250 vetted directories.</text>
    <text x="64" y="262" font-size="27" font-weight="500" fill="#C4C1B9">One brief, one payment, proof of every listing.</text>

    <g transform="translate(64 306)" font-size="17" font-weight="600">
      <rect width="178" height="48" rx="12" fill="#17171C" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="18" y="30" fill="#F2F0EA">from <tspan fill="#FFD12E">$49</tspan> one-time</text>
      <rect x="192" width="214" height="48" rx="12" fill="#17171C" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="210" y="30" fill="#F2F0EA"><tspan fill="#FFD12E">1,357</tspan> vetted directories</text>
      <rect x="420" width="206" height="48" rx="12" fill="#17171C" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="438" y="30" fill="#F2F0EA">screenshot <tspan fill="#A394FF">per listing</tspan></text>
      <rect x="640" width="168" height="48" rx="12" fill="#17171C" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="658" y="30" fill="#F2F0EA">done in <tspan fill="#4ADE80">7–14 days</tspan></text>
    </g>
    <text x="1216" y="392" text-anchor="end" font-size="16" fill="#8C8982">submitstorm.com</text>
  </g>
</svg>
